<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f3e9" />
    <meta name="description" content="A Tamil wedding invitation." />
    <title>Wedding Invitation</title>
    <link rel="preload" href="./assets/great-vibes-DOCVuyrd.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./assets/cormorant-regular-DQv4XaSs.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" crossorigin src="./assets/index-QnxutGkF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D2FghRJA.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>This invitation needs JavaScript enabled to open.</noscript>
    <script>
      // Static servers need the compiled invitation, not the React source entry.
      const sourceEntry = document.querySelector('script[src="/src/main.jsx"]');
      const viteClient = document.querySelector('script[src*="/@vite/client"]');
      if (sourceEntry && !viteClient) {
        const invitation = new URL('./dist/index.html', window.location.href);
        invitation.search = window.location.search;
        invitation.hash = window.location.hash;
        window.location.replace(invitation.href);
      }
    </script>
  </body>
</html>
